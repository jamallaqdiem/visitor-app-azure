name: Frontend Deploy
on:
  push:
    branches: [main, cleanup-remove-legacy-tests]
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Mandatory for GitHub integration
          action: "upload" # Mandatory to tell Azure to UPLOAD the code
          app_location: "client" # Path to React code
          output_location: "dist" # Where Vite puts the final files
          app_build_command: "npm install && npm run build"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
