name: Backend Deploy
on:
  push:
    branches: [main, feat-fix-deployment]
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
      - name: Install
        run: |
          cd server
          npm install
      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v2
        with:
          app-name: "v-backend-api-fwghnzajf4c3fggm" # <-- DOUBLE CHECK THIS NAME!
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./server
